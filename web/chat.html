<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Jarvis</title><link rel="stylesheet" href="/jarvis.css"><script src="/robot.js"></script>
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,var(--deep) 0%,var(--bg) 60%)}
header{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(var(--c-rgb),.07),transparent)}
header .sp{flex:1}
header button{padding:6px 11px;font-size:10px}
header h1{font-size:15px;letter-spacing:1.5px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:90%;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.user{align-self:flex-end;background:linear-gradient(135deg,rgba(var(--u-rgb),.55),rgba(var(--u2-rgb),.35));border:1px solid rgba(var(--c-rgb),.5);color:#fff;
  clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.assistant{align-self:flex-start;background:rgba(var(--p-rgb),.78);border:1px solid rgba(var(--c-rgb),.18);border-left:2px solid var(--cyan);white-space:normal;position:relative;padding-top:22px;
  box-shadow:-6px 0 16px -10px rgba(var(--c-rgb),.8)}
.assistant::before{content:"J.A.R.V.I.S.";position:absolute;top:6px;left:12px;font:700 8.5px var(--hud);letter-spacing:2px;color:var(--cyan);opacity:.8}
.assistant p{margin:0 0 8px}.assistant p:last-child{margin:0}
.assistant ul,.assistant ol{margin:4px 0 8px 18px;padding:0}
.assistant b{color:var(--cyan2)}
.assistant code{background:var(--rb3);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:13px;color:var(--cyan2)}
.assistant pre{background:var(--rb3);border:1px solid var(--line);padding:8px 10px;border-radius:4px;overflow-x:auto;white-space:pre}
.action{align-self:flex-start;font:12px Consolas,monospace;color:var(--cyan2);border-left:1px dashed var(--line2);padding:2px 10px;white-space:pre-line;opacity:.9}
.action::first-line{color:var(--cyan)}
.error{align-self:center;color:var(--red);font-size:13px;text-align:center}
.info{align-self:center;color:var(--yellow);font-size:13px}
.hello{margin:auto;text-align:center;color:var(--dim);max-width:420px}
.hello .orb{width:120px;height:120px;margin:0 auto 14px;display:block;filter:drop-shadow(0 0 14px rgba(var(--c-rgb),.7))}
.hello h2{color:var(--white);font:500 19px var(--hud);letter-spacing:1.5px;margin:0 0 6px}
.hello button{margin:4px;font-size:10px}
.typing{align-self:flex-start;color:var(--cyan);font:600 10px var(--hud);letter-spacing:2px;display:flex;align-items:center;gap:8px}
.typing .bars{display:flex;gap:3px;align-items:flex-end;height:14px}
.typing .bars i{width:3px;background:var(--cyan);box-shadow:var(--glow);animation:eq .9s ease-in-out infinite}
.typing .bars i:nth-child(2){animation-delay:.15s}.typing .bars i:nth-child(3){animation-delay:.3s}.typing .bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
#bar{border-top:1px solid var(--line2);padding:10px 12px 12px;background:rgba(var(--p-rgb),.85)}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:9px;align-items:center}
.opts label{display:flex;align-items:center;gap:7px;cursor:pointer;color:#a9c9dd}
.ctrl-on{color:var(--yellow)!important}
.send{display:flex;gap:8px;align-items:flex-end}
textarea{resize:none;min-height:42px;max-height:160px;overflow-y:auto;border-radius:0;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
#attach{padding:11px 12px;font-size:14px}
#send{padding:12px 16px}
#chip{font-size:12px;color:var(--cyan);margin-bottom:6px}
#stopBanner{display:none;background:rgba(60,44,10,.9);border-bottom:1px solid rgba(255,207,92,.4);color:var(--yellow);padding:8px 14px;font-size:13px;align-items:center;gap:10px}
#stopBanner.show{display:flex}
#stopBanner span{flex:1}
#mic{padding:11px 12px;font-size:15px}
.hello .bot{display:block;margin:0 auto 6px;cursor:pointer}
/* ---- modo voz ---- */
#voice{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(90% 70% at 50% 45%,rgba(var(--p2-rgb),.96),rgba(3,8,16,.98))}
#voice.show{display:flex}
#voice .stage{position:relative;width:min(340px,86vw);height:min(340px,86vw);display:flex;align-items:center;justify-content:center}
#voice canvas{position:absolute;inset:0;width:100%;height:100%}
#voice .botwrap{position:relative;cursor:pointer}
#vState{font:700 12px var(--hud);letter-spacing:3px;color:var(--cyan);text-shadow:var(--glow);margin-top:10px;text-transform:uppercase}
#vHint{color:var(--dim);font-size:12px;margin-top:4px;min-height:16px}
#vText{max-width:86%;text-align:center;margin-top:16px;min-height:44px;font:500 17px/1.35 var(--tech);color:#e9f9ff}
#vText.you{color:var(--cyan2);font-style:italic}
#voice .vbtns{display:flex;gap:18px;margin-top:26px;align-items:center}
#voice .round{width:58px;height:58px;border-radius:50%;clip-path:none;font-size:20px;padding:0;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI Emoji","Segoe UI",sans-serif;letter-spacing:0}
#voice .round.end{background:rgba(255,69,58,.22);border-color:#ff6961;color:#ff8a8a}
#voice .round.off{background:rgba(120,120,128,.25);border-color:#888;color:#ccc}
#vLang{font-size:11px;width:58px;height:58px;border-radius:50%;clip-path:none;padding:0}
#vErr{color:var(--red);font-size:13px;margin-top:10px;max-width:86%;text-align:center}
</style></head><body class="scan">
<header><svg class="reactor" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke-opacity=".35" stroke-width="1" style="stroke:var(--cyan)"/>
<g class="r1"><circle cx="20" cy="20" r="15" fill="none" stroke-width="2" stroke-dasharray="10 5" style="stroke:var(--cyan)"/></g>
<g class="r2"><circle cx="20" cy="20" r="10.5" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke:var(--cyan2)"/></g>
<circle class="core" cx="20" cy="20" r="5.5" style="fill:var(--core)"/></svg><h1><span>Ask</span> J.A.R.V.I.S.</h1><span class="sp"></span>
  <button id="newChat" title="Start a new conversation">New chat</button><button id="settings">⚙</button></header>
<div id="stopBanner"><span>🖱 Jarvis is using your computer. Press <b>Esc</b> or Stop to stop it.</span><button id="stop2" class="danger">■ Stop</button></div>
<div id="log"></div>
<div id="voice">
  <div class="stage"><canvas id="orb"></canvas><div class="botwrap" id="vBot" title="Tap the reactor to interrupt / finish talking"></div></div>
  <div id="vState">Starting…</div><div id="vHint"></div>
  <div id="vText"></div><div id="vErr"></div>
  <div class="vbtns"><button class="round" id="vMute" title="Mute / unmute microphone">🎙</button>
    <button id="vLang" title="Language">EN</button>
    <button class="round end" id="vEnd" title="End voice chat">✕</button></div>
</div>
<div id="bar">
  <div class="opts">
    <label title="Jarvis takes a picture of your screen with this message"><input type="checkbox" id="look"> 👁 Look at my screen</label>
    <label id="ctrlLabel" title="Jarvis can click and type on your computer"><input type="checkbox" id="control"> 🖱 Let Jarvis control</label>
  </div>
  <div id="chip" hidden></div>
  <div class="send">
    <button id="attach" title="Attach a picture (or paste one with Ctrl+V)">📎</button>
    <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    <textarea id="text" rows="1" placeholder="Ask J.A.R.V.I.S. anything…" title="Enter to send · Shift+Enter for a new line"></textarea>
    <button id="mic" title="Talk to J.A.R.V.I.S. with your voice">🎙</button>
    <button id="send" class="primary">Send</button>
  </div>
</div>
<script>
const K = new URLSearchParams(location.search).get("k");
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Jarvis-Key": K, "Content-Type": "application/json" } })
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ("Error " + r.status)); return j; });
const $ = id => document.getElementById(id);
let USE = "school";
let since = 0, running = false, img = null, hasKey = true, poll = null;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function md(t) {
  const blocks = esc(t).split(/```/);
  return blocks.map((b, i) => {
    if (i % 2) return `<pre>${b.replace(/^\w*\n/, "")}</pre>`;
    return b.split(/\n{2,}/).map(p => {
      p = p.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\s)\*([^*\n]+)\*/g, "$1<i>$2</i>");
      const lines = p.split("\n");
      if (lines.every(l => /^\s*[-*•] /.test(l))) return "<ul>" + lines.map(l => "<li>" + l.replace(/^\s*[-*•] /, "") + "</li>").join("") + "</ul>";
      if (lines.every(l => /^\s*\d+[.)] /.test(l))) return "<ol>" + lines.map(l => "<li>" + l.replace(/^\s*\d+[.)] /, "") + "</li>").join("") + "</ol>";
      return "<p>" + lines.join("<br>").replace(/^#+ (.*)/, "<b>$1</b>") + "</p>";
    }).join("");
  }).join("");
}
function hello() {
  $("log").innerHTML = `<div class="hello"><div id="helloBot" class="bot" title="Talk to me!">${JarvisRobot.svg(130)}</div><svg class="orb" style="display:none" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="none" stroke-opacity=".25" style="stroke:var(--cyan)"/>
      <g class="r1" style="animation:spin 14s linear infinite;transform-origin:60px 60px"><circle cx="60" cy="60" r="48" fill="none" stroke-width="2" stroke-dasharray="40 12 6 12" style="stroke:var(--cyan)"/></g>
      <g style="animation:spin 9s linear infinite reverse;transform-origin:60px 60px"><circle cx="60" cy="60" r="38" fill="none" stroke-width="1.5" stroke-dasharray="3 6" style="stroke:var(--cyan2)"/></g>
      <g style="animation:spin 20s linear infinite;transform-origin:60px 60px"><circle cx="60" cy="60" r="28" fill="none" stroke-opacity=".6" stroke-width="6" stroke-dasharray="2 9" style="stroke:var(--cyan)"/></g>
      <circle cx="60" cy="60" r="14" fill-opacity=".18" style="fill:var(--cyan)"/><circle cx="60" cy="60" r="8" style="fill:var(--core);animation:core 2.4s ease-in-out infinite"/></svg>
    <h2>HOW CAN I HELP?</h2>
    <div>Ask about homework, a topic you're studying, or something on your screen.</div><br>
    ${USE === "work" ? `<button data-q="What meetings do I have today and tomorrow? Help me plan my day.">📅 Plan my day</button>
    <button data-q="Help me write a short, polite email. Ask me what it's about first.">✉ Write an email</button>` :
    `<button data-q="What homework do I have today and tomorrow? Help me plan.">📚 Plan my homework</button>`}
    <button data-q="Explain what's on my screen and help me understand it." data-look="1">👁 Explain my screen</button>
    ${USE === "work" ? "" : `<button data-q="Make me 5 practice questions about my next class's subject.">📝 Quiz me</button>`}
    <button data-voice="1">🎙 Talk to me</button>
    ${hasKey ? "" : `<br><br><span class="warn">No AI connected: I can answer the basics (next class, homework, weather, meetings, timers). Connect an AI in ⚙ Settings for everything else.</span>`}</div>`;
  $("log").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { $("text").value = b.dataset.q; if (b.dataset.look) $("look").checked = true; send(); });
  $("log").querySelector("[data-voice]").onclick = openVoice;
  $("helloBot").onclick = openVoice;
}
function render(items) {
  const log = $("log");
  if (items.length && log.querySelector(".hello")) log.innerHTML = "";
  log.querySelector(".typing")?.remove();
  for (const it of items) {
    let el = log.querySelector(`[data-n="${it.n}"]`);
    if (!el) { el = document.createElement("div"); el.dataset.n = it.n; el.className = "m " + it.kind; log.appendChild(el); }
    if (it.kind === "assistant") el.innerHTML = md(it.text); else el.textContent = it.text;
  }
  if (running) { const t = document.createElement("div"); t.className = "typing"; t.innerHTML = '<span class="bars"><i></i><i></i><i></i><i></i></span> PROCESSING'; log.appendChild(t); }
  log.scrollTop = log.scrollHeight;
}
async function refresh() {
  try {
    const r = await api("/api/chat/log?since=" + Math.max(0, since - 1));
    hasKey = r.hasKey;
    if (r.use && r.use !== USE) { USE = r.use; if (!since) hello(); }
    if (r.theme && r.theme !== (document.documentElement.dataset.theme || "jarvis") && !r.running && !V.on) { location.reload(); return; }
    const was = running; running = r.running;
    if (r.items.length) { since = r.items[r.items.length - 1].n + 1; }
    if (r.items.length || was !== running) render(r.items);
    if (!since && !running && !$("log").querySelector(".hello")) hello();
    $("send").disabled = running; $("send").textContent = running ? "…" : "Send";
    $("stopBanner").classList.toggle("show", running && $("control").checked);
    if (!running && was) $("text").focus();
  } catch (e) {}
}
async function send() {
  const text = $("text").value.trim();
  if ((!text && !img) || running) return;
  try {
    await api("/api/chat", { method: "POST", body: JSON.stringify({ text, look: $("look").checked, control: $("control").checked, image: img?.data || "", imageType: img?.type || "" }) });
    $("text").value = ""; autosize(); img = null; $("chip").hidden = true; $("look").checked = false;
    running = true; refresh();
  } catch (e) {
    const d = document.createElement("div"); d.className = "m error"; d.textContent = e.message; $("log").appendChild(d);
    if (/Settings/.test(e.message)) { const b = document.createElement("button"); b.textContent = "Open Settings"; b.onclick = openSettings; d.appendChild(document.createElement("br")); d.appendChild(b); }
  }
}
function openSettings() { api("/api/open-settings", { method: "POST", body: JSON.stringify({ hash: "#ai" }) }); }
function autosize() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; }
function setImage(file) {
  if (!file || !/^image\/(png|jpeg|gif|webp)$/.test(file.type)) return;
  const rd = new FileReader(); rd.onload = () => { img = { data: rd.result.split(",")[1], type: file.type }; $("chip").hidden = false; $("chip").innerHTML = `🖼 ${esc(file.name || "picture")} attached <a href="#" id="rm">remove</a>`; $("rm").onclick = e => { e.preventDefault(); img = null; $("chip").hidden = true; }; };
  rd.readAsDataURL(file);
}
$("send").onclick = send;
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("text").addEventListener("input", autosize);
$("text").addEventListener("paste", e => { for (const it of e.clipboardData.items) if (it.type.startsWith("image/")) { setImage(it.getAsFile()); e.preventDefault(); } });
$("attach").onclick = () => $("file").click();
$("file").onchange = () => { setImage($("file").files[0]); $("file").value = ""; };
$("control").onchange = () => {
  if ($("control").checked && !confirm("Let Jarvis use your mouse and keyboard for your next messages?\n\nIt will NOT type passwords, buy things, send messages or hand in work.\nPress Esc anytime to stop it.")) $("control").checked = false;
  $("ctrlLabel").classList.toggle("ctrl-on", $("control").checked);
};
$("stop2").onclick = () => api("/api/chat/stop", { method: "POST" });
$("newChat").onclick = async () => { try { await api("/api/chat/new", { method: "POST" }); since = 0; hello(); } catch (e) { alert(e.message); } };
$("settings").onclick = openSettings;
document.addEventListener("keydown", e => { if (e.key === "Escape" && running) api("/api/chat/stop", { method: "POST" }); });
hello(); refresh(); poll = setInterval(refresh, 700);
// cor do tema (para o canvas)
function cssHex(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return /^#[0-9a-f]{6}$/i.test(v) ? v : "#3fd4ff";
}
// ================= MODO VOZ =================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const V = { on: false, muted: false, state: "idle", rec: null, stream: null, an: null, ac: null, lvl: 0, speaking: false,
  lang: localStorage.getItem("jvlang") || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en") };
$("vBot").innerHTML = JarvisRobot.svg(190);
const vbot = () => $("vBot").querySelector(".jrobot");
const LANGS = { en: { rec: "en-GB", tts: ["en-GB", "en-US"], male: /Ryan|Thomas|Guy|Christopher|Eric|George|Andrew|Brian/i, label: "EN",
    st: { listening: "Listening", thinking: "Thinking", speaking: "Speaking", muted: "Mic off" }, hint: "Just talk. Tap the reactor to interrupt." },
  pt: { rec: "pt-BR", tts: ["pt-BR", "pt-PT"], male: /Antonio|Duarte|Daniel|Donato|Fabio|Julio/i, label: "PT",
    st: { listening: "Ouvindo", thinking: "Pensando", speaking: "Falando", muted: "Mic desligado" }, hint: "É só falar. Toque no reator para interromper." } };
function L() { return LANGS[V.lang] || LANGS.en; }
function vSet(state, hint) {
  V.state = state; JarvisRobot.set(vbot(), state === "muted" ? "sleep" : state);
  $("vState").textContent = L().st[state] || state; $("vHint").textContent = hint ?? (state === "listening" ? L().hint : "");
}
function vText(t, you) { $("vText").textContent = t || ""; $("vText").className = you ? "you" : ""; }
async function openVoice() {
  $("vErr").textContent = "";
  $("vLang").textContent = L().label;
  $("voice").classList.add("show"); V.on = true;
  if (!SR) { vSet("idle", ""); $("vErr").textContent = "Voice isn't available here. Open Jarvis in Microsoft Edge."; return; }

  try {
    V.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    V.ac = new AudioContext(); V.an = V.ac.createAnalyser(); V.an.fftSize = 512;
    V.ac.createMediaStreamSource(V.stream).connect(V.an);
  } catch (e) { $("vErr").textContent = "Jarvis needs the microphone. Click Allow when asked (or allow it in the address bar settings)."; }
  speechSynthesis.getVoices();
  vText(V.lang === "pt" ? "Oi! Pode falar." : "Hi! I'm listening.");
  listen();
}
function closeVoice() {
  V.on = false; try { V.rec && V.rec.abort(); } catch (e) {}
  speechSynthesis.cancel(); V.speaking = false;
  if (V.stream) V.stream.getTracks().forEach(t => t.stop()); V.stream = null;
  if (V.ac) V.ac.close(); V.ac = null; V.an = null;
  $("voice").classList.remove("show"); vSet("idle", "");
}
function listen() {
  if (!V.on || !SR) return;
  if (V.muted) { vSet("muted", V.lang === "pt" ? "Toque no microfone para ligar." : "Tap the mic to turn it on."); return; }
  vSet("listening");
  const rec = new SR(); V.rec = rec;
  rec.lang = L().rec; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = "";
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    vText((finalText + " " + interim).trim(), true);
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { V.muted = true; $("vErr").textContent = "Microphone blocked. Allow it and try again."; }
    else if (e.error === "network") $("vErr").textContent = "Voice recognition needs internet.";
  };
  rec.onend = () => {
    if (V.rec === rec) V.rec = null;
    if (!V.on) return;
    if (finalText.trim()) sendVoice(finalText.trim());
    else if (V.state === "listening") setTimeout(listen, 200);
    else if (V.state === "muted") vSet("muted");
  };
  try { rec.start(); } catch (e) { setTimeout(listen, 500); }
}
async function sendVoice(text) {
  vSet("thinking"); vText(text, true);
  const from = since;
  try {
    await api("/api/chat", { method: "POST", body: JSON.stringify({ text, voice: true }) });
  } catch (e) { return speak(e.message); }
  running = true;
  // espera a resposta
  for (let i = 0; i < 400 && V.on; i++) {
    await new Promise(r => setTimeout(r, 600));
    const r = await api("/api/chat/log?since=" + from).catch(() => null);
    if (r && !r.running) {
      const reply = r.items.filter(x => x.kind === "assistant" || x.kind === "error" || x.kind === "info").map(x => x.text).join(" ");
      refresh();
      return speak(reply || (V.lang === "pt" ? "Pronto." : "Done."));
    }
  }
}
function plain(t) {
  return t.replace(/```[\s\S]*?```/g, " ").replace(/`([^`]+)`/g, "$1").replace(/\*\*?([^*]+)\*\*?/g, "$1")
    .replace(/^\s*[-*•]\s+/gm, "").replace(/^#+\s*/gm, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "").replace(/\s+/g, " ").trim();
}
const FEMALE = { en: /Sonia|Libby|Maisie|Jenny|Aria|Emma|Ava|Michelle|Hazel|Susan/i, pt: /Francisca|Thalita|Raquel|Brenda|Leila|Yara|Fernanda|Maria/i };
const isFriday = () => document.documentElement.dataset.theme === "friday";
// vozes masculinas por ordem de preferência (as "Natural" do Edge soam muito mais humanas)
const MALE_PREF = {
  en: ["Ryan", "Thomas", "Guy", "Andrew", "Brian", "Christopher", "Eric", "Roger", "Steffan", "William", "Liam", "Davis", "George", "David", "Mark", "James"],
  pt: ["Antonio", "Duarte", "Donato", "Fabio", "Julio", "Nicolau", "Valerio", "Humberto", "Daniel"] };
const FEMALE_PREF = {
  en: ["Sonia", "Libby", "Maisie", "Jenny", "Aria", "Emma", "Ava", "Michelle", "Hazel", "Susan", "Zira"],
  pt: ["Francisca", "Thalita", "Raquel", "Brenda", "Leila", "Yara", "Fernanda", "Maria"] };
const FEMALE_ANY = /Sonia|Libby|Maisie|Jenny|Aria|Emma|Ava|Michelle|Hazel|Susan|Zira|Francisca|Thalita|Raquel|Brenda|Leila|Yara|Fernanda|Maria|Elsa|Heera|Natasha|Clara|Sara|Jane|Ana\b|Female/i;
let VOICE = null, VOICE_MALE = true;

  const vs = speechSynthesis.getVoices(), l = L(), fem = isFriday();

  const langOK = v => l.tts.some(t => v.lang.replace("_", "-").toLowerCase() === t.toLowerCase());
  const score = v => {
    let sc = 0;
    if (!langOK(v)) return -1;
    const i = prefs.findIndex(n => v.name.includes(n));
    if (i >= 0) sc += 100 - i;                 // nome preferido
    if (/Natural/i.test(v.name)) sc += 300;    // voz neural (fluida)
    if (/Online/i.test(v.name)) sc += 50;
    if (v.lang.toLowerCase() === l.tts[0].toLowerCase()) sc += 20; // sotaque principal (en-GB / pt-BR)
    if (!fem && FEMALE_ANY.test(v.name)) sc -= 500;  // J.A.R.V.I.S. nunca com voz feminina
    if (fem && i < 0) sc -= 200;

  const best = vs.map(v => [score(v), v]).filter(x => x[0] >= 0).sort((a, b) => b[0] - a[0])[0];

// junta frases em blocos grandes: fala contínua, sem pausas entre frases
function chunks(text) {

  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);

    u.lang = (u.voice && u.voice.lang) || L().rec;

  else if (V.state === "listening" && V.rec) V.rec.stop();

};

  V.muted = !V.muted; $("vMute").classList.toggle("off", V.muted); $("vMute").textContent = V.muted ? "🔇" : "🎙";
  if (V.muted) { try { V.rec && V.rec.abort(); } catch (e) {} vSet("muted"); } else if (V.state !== "thinking" && V.state !== "speaking") listen();

// orbe animado (estilo ChatGPT) + nível de som
(function orbLoop() {
  const cv = $("orb"), c = cv.getContext("2d");
  const W = cv.clientWidth, H = cv.clientHeight;
  if (W && (cv.width !== W * 2)) { cv.width = W * 2; cv.height = H * 2; }
  if (V.on) {
    // nível
    let lvl = 0;
    if (V.state === "listening" && V.an) {
      const d = new Uint8Array(V.an.fftSize); V.an.getByteTimeDomainData(d);
      let sum = 0; for (const x of d) { const v = (x - 128) / 128; sum += v * v; }
      lvl = Math.min(1, Math.sqrt(sum / d.length) * 6);
    } else if (V.state === "speaking") {
      const t = performance.now() / 1000; lvl = .35 + .35 * Math.abs(Math.sin(t * 7.3)) * (.6 + .4 * Math.sin(t * 2.1));
    } else if (V.state === "thinking") lvl = .15;
    V.lvl += (lvl - V.lvl) * .25;
    JarvisRobot.level(vbot(), V.lvl);
    // desenha a bola
    const w = cv.width, h = cv.height, cx = w / 2, cy = h / 2, t = performance.now() / 1000;
    c.clearRect(0, 0, w, h);
    const base = Math.min(w, h) * .36 * (1 + V.lvl * .22);
    const cols = V.state === "thinking" ? ["#ffcf5c", "#ff9f0a"] : V.state === "muted" ? ["#5d7890", "#2a3a4a"] : [cssHex("--cyan2"), cssHex("--btn1")];
    for (let layer = 0; layer < 3; layer++) {
      c.beginPath();
      const amp = (6 + V.lvl * 26) * (1 + layer * .5) * (w / 680);
      for (let a = 0; a <= Math.PI * 2 + .01; a += Math.PI / 90) {
        const r = base * (1 - layer * .06) + amp * (Math.sin(a * 3 + t * (1.4 + layer * .5)) * .6 + Math.sin(a * 5 - t * (2 + layer)) * .4);
        const x = cx + Math.cos(a + (V.state === "thinking" ? t : 0)) * r, y = cy + Math.sin(a + (V.state === "thinking" ? t : 0)) * r;
        a === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      const g = c.createRadialGradient(cx, cy - base * .3, base * .1, cx, cy, base * 1.2);
      g.addColorStop(0, cols[0] + (layer ? "22" : "55")); g.addColorStop(1, cols[1] + (layer ? "10" : "30"));
      c.fillStyle = g; c.fill();
      c.strokeStyle = cols[0] + (layer ? "40" : "aa"); c.lineWidth = (layer ? 1 : 2.2) * (w / 680); c.stroke();

})();
