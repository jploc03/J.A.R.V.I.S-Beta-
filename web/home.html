<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title><link rel="stylesheet" href="/jarvis.css"><script src="/robot.js"></script>
<style>
html,body{height:100%}
html{background:#06101e}
body{display:flex;flex-direction:column;overflow:hidden;background:transparent!important}
#sky{position:fixed;inset:0;z-index:-1;width:100vw;height:100vh;display:block}
.top{display:flex;align-items:center;gap:22px;padding:14px 20px;border-bottom:1px solid rgba(120,190,255,.15);background:rgba(4,10,20,.18)}
.brand{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--line2);cursor:pointer;transition:filter .2s}
.brand:hover{filter:brightness(1.35) drop-shadow(0 0 10px rgba(var(--c-rgb),.7))}
.brand:hover .reactor .r1{animation-duration:1.5s}
.top button.ico{font-size:16px;padding:7px 12px;letter-spacing:0}
.foot .rf{cursor:pointer;color:var(--cyan);margin-left:8px}
.foot .rf:hover{text-shadow:var(--glow)}
.brand .word{font:700 17px var(--hud);letter-spacing:4px;color:#fff;text-shadow:var(--glow)}
.brand .sub{font:500 11px var(--tech);letter-spacing:2.5px;color:var(--cyan);text-transform:uppercase;opacity:.8}
.clock{font:500 40px/1 var(--hud);color:#fff;letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(var(--c-rgb),.65)}
.clock small{font-size:15px;color:var(--cyan);margin-left:3px;opacity:.8}
.date{color:var(--cyan2);font:600 15px var(--tech);letter-spacing:1px;margin-top:5px;text-transform:uppercase}
.greet{color:var(--dim);font-size:12.5px}
.wx{display:flex;align-items:center;gap:10px;margin-left:8px;padding-left:22px;border-left:1px solid var(--line)}
.wx .ic{font-size:34px}
.wx .t{font:500 24px var(--hud);color:#fff}
.wx .d{font-size:12px;color:var(--dim)}
.sp{flex:1}
.top button{font-size:10px}
#mini{font-weight:600}
.wrap{flex:1;display:grid;grid-template-columns:1fr 390px;min-height:0}
.main{overflow-y:auto;padding:16px 18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.card{background:rgba(var(--p-rgb),.6);border:1px solid rgba(120,190,255,.16);border-radius:14px;padding:13px 15px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(8px)}
.card h3{margin:0 0 10px;font:700 10.5px var(--hud);letter-spacing:2.2px;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;text-shadow:0 0 8px rgba(var(--c-rgb),.5)}
.card h3::after{content:"";flex:0 0 26px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin-left:8px;opacity:.6}
.card h3 span{order:3}
.card h3 span{margin-left:auto;letter-spacing:0;text-transform:none;color:var(--dim);font:500 13px var(--tech);text-shadow:none}
.full{grid-column:1/-1}
.next{display:flex;gap:16px;align-items:center}
.next .big{font:600 30px/1.1 var(--tech);color:#fff;letter-spacing:.5px}
.next .sub{color:var(--text)}
.next .cd{margin-left:auto;text-align:right;color:var(--cyan);font:500 26px var(--hud);white-space:nowrap;text-shadow:var(--glow)}
.next .cd small{display:block;font-size:12px;color:var(--dim)}
.now{color:var(--yellow);margin-bottom:8px;font-size:13.5px}
.cls{display:flex;gap:10px;padding:6px 8px;align-items:baseline;border-left:2px solid transparent}
.cls .tm{min-width:92px;color:var(--cyan2);font:600 14px var(--tech);letter-spacing:.5px}
.cls b{color:#fff;font-weight:600}
.cls i{font-style:normal;color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
.cls.past{opacity:.45}
.cls.cur{background:linear-gradient(90deg,rgba(255,207,92,.16),transparent);border-left-color:var(--yellow)}
.cls.nxt{background:linear-gradient(90deg,rgba(var(--c-rgb),.12),transparent);border-left-color:var(--cyan)}
.day{font:600 11px var(--tech);letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:8px 0 2px}
.hw{display:flex;gap:10px;padding:5px 8px;border-radius:8px;align-items:center}
.hw[data-url]{cursor:pointer}.hw[data-url]:hover{background:rgba(95,208,255,.08)}
.hw .tm{min-width:62px;color:var(--cyan2);font:600 14px var(--tech)}
.hw .tt{flex:1;min-width:0}
.hw b{display:block;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw small{color:var(--dim)}
.hw.done b{text-decoration:line-through;opacity:.55}
.tag{font-size:11px;padding:1px 8px;border-radius:8px;white-space:nowrap;background:rgba(255,255,255,.06);color:var(--dim)}
.tag.ok{background:rgba(60,220,140,.15);color:var(--green)}
.tag.late{background:rgba(255,90,90,.18);color:var(--red)}
.empty{color:var(--green);padding:3px 8px;font-size:13px}
.empty.dim{color:var(--dim)}
table.week{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.week th{font:700 10px var(--hud);letter-spacing:2px;color:var(--dim);padding:2px}
.week th.today{color:var(--cyan)}
.week td{background:rgba(var(--cell-rgb),.72);border:1px solid rgba(var(--c-rgb),.1);padding:6px 7px;vertical-align:top;font-size:12px;height:48px}
.week td.t{background:none;border:0;color:var(--cyan2);font:600 13px var(--tech);width:86px;vertical-align:middle}
.week td b{display:block;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week td span{color:var(--dim);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week td.todaycol{border-color:rgba(var(--c-rgb),.45);box-shadow:inset 0 0 12px rgba(var(--c-rgb),.12)}
.week td.curcell{background:rgba(255,207,92,.16);border-color:rgba(255,207,92,.6);box-shadow:0 0 12px rgba(255,207,92,.3)}
.week td.none{background:transparent}
.banner{grid-column:1/-1;background:rgba(48,38,10,.7)!important;border-color:rgba(255,207,92,.35)!important;color:var(--yellow);padding:10px 14px;display:flex;gap:12px;align-items:center}
.banner span{flex:1}
.chat{border-left:1px solid rgba(120,190,255,.16);display:flex;min-height:0;background:rgba(var(--p-rgb),.55);backdrop-filter:blur(4px)}
.chat iframe{border:0;width:100%;height:100%}
.foot{grid-column:1/-1;color:var(--dim);font-size:12px;display:flex;gap:12px}
.wrap.closed{grid-template-columns:1fr}
.wrap.closed .chat{display:none}
.wrap.closed .main{grid-template-columns:1fr 1fr 1fr}
.wrap.closed .main .full{grid-column:1/-1}
.wrap.closed #alertsCard{grid-column:span 2}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.main,.wrap.closed .main{grid-template-columns:1fr}
  .wrap:not(.closed) .chat{position:fixed;right:0;top:80px;bottom:0;width:min(400px,100vw);z-index:20}}
#askBtn{display:none}
#chatBtn.on{background:rgba(var(--c-rgb),.2);color:#fff}
#robotBtn{position:fixed;right:22px;bottom:18px;z-index:30;cursor:pointer;display:none;filter:drop-shadow(0 0 12px rgba(var(--c-rgb),.5));transition:transform .2s}
#robotBtn:hover{transform:scale(1.08)}
#robotBtn .tip{position:absolute;right:86px;bottom:30px;white-space:nowrap;background:rgba(var(--p-rgb),.9);border:1px solid var(--line2);color:var(--cyan);font:700 9.5px var(--hud);letter-spacing:1.5px;padding:6px 10px;opacity:0;transition:opacity .2s;pointer-events:none}
#robotBtn:hover .tip{opacity:1}
.wrap.closed ~ #robotBtn{display:block}
/* ---- Timer (estilo Apple) ---- */
.timer{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:170px;height:170px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:#2b2b31}
.ring .fg{stroke:#ff9f0a;stroke-linecap:round;transition:stroke .3s;filter:drop-shadow(0 0 5px rgba(255,159,10,.8))}
.ring.done .fg{stroke:#ff453a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .left{font:500 30px var(--hud);color:#fff;letter-spacing:1px;text-shadow:0 0 12px rgba(255,159,10,.5)}
.ring .bell{font-size:12px;color:var(--dim);margin-top:2px}
.ring .lab{font-size:12px;color:#ffb340;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tside{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.pick{display:flex;align-items:flex-end;gap:6px}
.pick label{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);gap:3px}
.pick input{width:60px;text-align:center;font:500 24px var(--hud);padding:5px 2px;background:rgba(20,16,8,.7);border-color:rgba(255,159,10,.35);color:#ffd08a}
.pick span{font-size:24px;color:var(--dim);padding-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 10px;font-size:9.5px;background:rgba(40,28,8,.6);border-color:rgba(255,159,10,.4);color:#ffb340}
.chips button:hover{background:#3a3a44}
.tbtns{display:flex;gap:16px}
.cbtn{width:66px;height:66px;border-radius:50%;padding:0;font-size:9.5px;letter-spacing:1px;clip-path:none;border:1.5px solid currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.55) inset,0 0 10px -2px currentColor}
.cbtn.cancel{background:rgba(120,120,128,.28);color:#e8e8ee}
.cbtn.cancel:hover{background:rgba(120,120,128,.4)}
.cbtn.start{background:rgba(48,209,88,.22);color:#30d158}
.cbtn.start:hover{background:rgba(48,209,88,.32)}
.cbtn.pause{background:rgba(255,159,10,.22);color:#ff9f0a}
.cbtn.pause:hover{background:rgba(255,159,10,.32)}
.cbtn.stop{background:rgba(255,69,58,.25);color:#ff6961}
.cbtn:disabled{opacity:.35}
#tLabel{font-size:12.5px;padding:6px 9px}
/* ---- Ferramentas ---- */
.tabs{display:flex;gap:3px;margin:-2px 0 12px}
.tabs button{flex:1;padding:6px 4px;font-size:8.5px;letter-spacing:.6px;background:transparent;border-color:rgba(var(--c-rgb),.25);color:var(--dim)}
.tabs button.on{background:rgba(var(--c-rgb),.18);border-color:var(--cyan);color:#fff;box-shadow:0 0 10px rgba(var(--c-rgb),.35)}
.calc{max-width:330px;margin:0 auto}
.cdisp{background:rgba(0,0,0,.35);border:1px solid var(--line2);padding:8px 12px;text-align:right;margin-bottom:8px;min-height:64px}
#cExpr{font:500 14px var(--tech);color:var(--dim);min-height:18px;word-break:break-all}
#cRes{font:500 28px var(--hud);color:#fff;text-shadow:var(--glow);overflow:hidden;text-overflow:ellipsis}
#cRes.final{color:var(--cyan2)}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{padding:10px 0;font-size:14px;letter-spacing:0;font-family:var(--hud)}
.ckeys button.op{color:#ffb340;border-color:rgba(255,159,10,.5);background:rgba(60,36,8,.5)}
.ckeys button.eq{background:linear-gradient(90deg,var(--btn1),var(--btn2));color:#fff;border-color:var(--cyan)}
.ckeys button.clr{color:var(--red)}
.sw{text-align:center}
#swTime{font:500 44px var(--hud);color:#fff;text-shadow:var(--glow);margin:6px 0 12px;font-variant-numeric:tabular-nums}
#swTime small{font-size:22px;color:var(--cyan)}
.sw .tbtns{justify-content:center}
#swLaps{max-height:150px;overflow-y:auto;margin-top:10px;text-align:left}
.lap{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--line2);font:600 14px var(--tech)}
.lap small{font-size:12px;opacity:.7}.lap.best{color:var(--green)}.lap.worst{color:var(--red)}
#notes{min-height:220px;resize:vertical;font:500 15px/1.5 var(--tech);background:rgba(0,0,0,.3)}
#notesSaved{text-align:right;min-height:16px;margin-top:4px}
/* ---- Avisos ---- */
.mt{display:flex;gap:10px;align-items:center;padding:6px 8px;border-left:2px solid transparent}
.mt .tm{min-width:92px;color:var(--cyan2);font:600 14px var(--tech)}
.mt .tt{flex:1;min-width:0}.mt b{display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt small{color:var(--dim)}
.mt.live{background:linear-gradient(90deg,rgba(92,242,168,.14),transparent);border-left-color:var(--green)}
.mt.soon{background:linear-gradient(90deg,rgba(var(--c-rgb),.14),transparent);border-left-color:var(--cyan)}
.mt .join{padding:6px 12px;font-size:10px}
.al{display:flex;gap:10px;padding:6px 6px;border-radius:8px;align-items:flex-start}
.al .ic{font-size:18px;line-height:1.2}
.al b{color:#fff;font-weight:600;display:block}
.al small{color:var(--dim)}
.al .ago{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
.rainbars{display:flex;gap:3px;align-items:flex-end;height:46px;margin:6px 0 2px}
.rainbars div{flex:1;background:linear-gradient(var(--cyan2),#0a5f96);min-height:2px;position:relative;box-shadow:0 0 6px rgba(var(--c-rgb),.4)}
.rainlab{display:flex;gap:3px;font-size:10px;color:var(--dim)}
.rainlab span{flex:1;text-align:center}
</style></head><body class="scan">
<canvas id="sky"></canvas>
<div class="top">
  <div class="brand" id="brand" title="Click the reactor to talk to J.A.R.V.I.S. 🎙"><svg class="reactor" viewBox="0 0 40 40" style="width:44px;height:44px"><circle cx="20" cy="20" r="18" fill="none" stroke-opacity=".35" stroke-width="1" style="stroke:var(--cyan)"/>
<g class="r1"><circle cx="20" cy="20" r="15" fill="none" stroke-width="2" stroke-dasharray="10 5" style="stroke:var(--cyan)"/></g>
<g class="r2"><circle cx="20" cy="20" r="10.5" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke:var(--cyan2)"/></g>
<circle class="core" cx="20" cy="20" r="5.5" style="fill:var(--core)"/></svg><div><div class="word">J.A.R.V.I.S.</div><div class="sub" id="brandSub">tap to talk 🎙</div></div></div>
  <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><div class="greet" id="greet"></div></div>
  <div class="wx" id="wx"></div>
  <span class="sp"></span>
  <button id="askBtn">💬 Ask Jarvis</button>
  <button id="robotsBtn" class="ico" title="Robot Room — your robot team">🤖</button>
  <button id="chatBtn" class="ico" title="Show / hide the chat">💬</button>
  <button id="settings" class="ico" title="Settings">⚙</button>
  <button id="mini" class="primary" title="Turn into the small floating square">▣ Mini</button>
</div>
<div class="wrap">
  <div class="main" id="main"></div>
  <div class="chat"><iframe id="chatFrame" title="Ask Jarvis" allow="microphone"></iframe></div>
</div>
<div id="robotBtn" title="Open the chat"><span class="tip">TALK TO ME</span></div>
<script>
const K = new URLSearchParams(location.search).get("k");
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Jarvis-Key": K, "Content-Type": "application/json" } })
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ("Error " + r.status)); return j; });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const WX = c => c === 0 ? "☀️" : c <= 2 ? "⛅" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 57 ? "🌦️" : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌦️" : "⛈️";
let S = null;

$("chatFrame").src = "/chat?k=" + K + "&embed=1";

function greeting(h) { return h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function countdown(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return "now"; if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return h + "h" + (r ? pad(r) : "");
  const d = Math.round(h / 24); return d + " day" + (d > 1 ? "s" : "");
}
function whenDay(d, now) {
  const a = new Date(now); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0);
  const diff = Math.round((b - a) / 864e5);
  return diff === 0 ? "today" : diff === 1 ? "tomorrow" : d.toLocaleDateString("en-GB", { weekday: "long" });
}
function tick() {
  const now = new Date();
  $("clock").innerHTML = hm(now) + `<small>:${pad(now.getSeconds())}</small>`;
  $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  $("greet").textContent = greeting(now.getHours()) + (S?.userName ? ", " + S.userName : "") + (S?.weather?.city ? " · " + S.weather.city : "");
}

function hwRow(e, now) {
  const d = new Date(e.start);
  let t = hm(d); if (t === "00:00") t = "—"; if (t === "23:59") t = "end of day";
  const tag = e.done ? `<span class="tag ok">✓ done</span>` : (e.missing || (d < now && t !== "—")) ? `<span class="tag late">late</span>` : `<span class="tag">${esc(e.source)}</span>`;
  return `<div class="hw ${e.done ? "done" : ""}" ${e.url ? `data-url="${esc(e.url)}"` : ""}><span class="tm">${t}</span>
    <span class="tt"><b title="${esc(e.title)}">${esc(e.title)}</b>${e.course ? `<small>${esc(e.course)}</small>` : ""}</span>${tag}</div>`;
}

function render() {
  if (!S) return;
  const now = new Date();
  tick();
  const w = S.weather;
  $("wx").innerHTML = w.ok ? `<span class="ic">${WX(w.code)}</span><div><div class="t">${Math.round(w.temp)}°</div><div class="d">${esc(w.text)}</div></div>
    <div class="d">${Math.round(w.min)}° / ${Math.round(w.max)}° · rain ${w.rain}%<br>Tomorrow ${WX(w.tomCode)} ${Math.round(w.tomMax)}° · rain ${w.tomRain}%</div>` : `<div class="d">Weather loading…</div>`;

  let h = "";
  if (S.update && S.update.ready) h += `<div class="banner hud"><span>⬆ <b>J.A.R.V.I.S. ${esc(S.update.version)}</b> is ready to install.</span><button id="doUpdate" class="primary">Update now</button></div>`;
  const school = S.use !== "work";
  if (!school) h += meetingsCard(now, true);
  if (school) {
  if (S.canvasState === "notoken") h += `<div class="banner hud"><span>📚 Add your Canvas token so Jarvis can see your homework.</span><button data-set="#canvas">Open Settings</button></div>`;
  else if (S.canvasState === "badtoken") h += `<div class="banner hud"><span>📚 Canvas didn't accept your token. Paste a new one.</span><button data-set="#canvas">Open Settings</button></div>`;
  else if (S.canvasState === "error") h += `<div class="banner hud"><span>📚 Couldn't reach Canvas right now.</span><button id="retry">Try again</button></div>`;
  if (!S.timetable.length) h += `<div class="banner hud"><span>📅 Add your classes so Jarvis can show your next class.</span><button data-set="#classes">Add classes</button></div>`;

  // Próxima aula
  const cur = S.current, nx = S.next;
  h += `<div class="card hud full"><h3>🏫 Next class</h3>`;
  if (cur) h += `<div class="now">▶ Now: <b>${esc(cur.title)}</b> until ${hm(new Date(cur.end))}${cur.location ? " · " + esc(cur.location) : ""}</div>`;
  if (nx) {
    const s = new Date(nx.start);
    h += `<div class="next"><div><div class="big">${esc(nx.title)}</div>
      <div class="sub">${whenDay(s, now)} at ${hm(s)}${nx.end ? "–" + hm(new Date(nx.end)) : ""}${nx.location ? " · 📍 " + esc(nx.location) : ""}</div></div>
      <div class="cd">${countdown(s - now)}<small>${s - now < 60000 ? "" : "to go"}</small></div></div>`;
  } else h += `<div class="empty dim">No upcoming classes found.</div>`;
  h += `</div>`;

  // Aulas de hoje
  h += `<div class="card hud"><h3>📅 Today's classes <span>${S.today.length} classes</span></h3>`;
  if (!S.today.length) h += `<div class="empty dim">No classes today 🎉</div>`;
  for (const c of S.today) {
    const s = new Date(c.start), e = c.end ? new Date(c.end) : null;
    const cls = e && s <= now && now < e ? "cur" : (e ? e <= now : s <= now) ? "past" : (nx && c.start === nx.start ? "nxt" : "");
    h += `<div class="cls ${cls}"><span class="tm">${hm(s)}${e ? "–" + hm(e) : ""}</span><b>${esc(c.title)}</b><i>${esc(c.location || "")}</i></div>`;
  }
  h += `</div>`;

  // Lição
  const n = S.hwToday.length + S.hwTomorrow.length;
  h += `<div class="card hud"><h3>📚 Homework <span>${n} for today & tomorrow</span></h3>`;
  h += `<div class="day">Today</div>` + (S.hwToday.length ? S.hwToday.map(e => hwRow(e, now)).join("") : `<div class="empty">✓ Nothing due</div>`);

  if (S.hwLater.length) {
    let last = "";

        const mins = now.getHours() * 60 + now.getMinutes();

        h += c ? `<td class="${isCur ? "curcell" : d === todayName ? "todaycol" : ""}"><b title="${esc(c.subject)}">${esc(c.subject)}</b><span title="${esc(c.room)}">${esc(c.room)}</span></td>` : `<td class="none"></td>`;

  $("main").innerHTML = h;
  $("toolsSlot").replaceWith(toolsEl());

  $("main").querySelectorAll("[data-set]").forEach(el => el.onclick = () => openSettings(el.dataset.set));
  $("retry")?.addEventListener("click", refresh);
  $("refresh")?.addEventListener("click", refresh);

}

const APPICON = { "Teams": "🟣", "Google Meet": "🟢", "Zoom": "🔵", "link": "🔗" };

  let last = "";

      <span class="tt"><b>${esc(m.title)}</b><small>${[m.with ? "with " + esc(m.with) : "", esc(m.source)].filter(Boolean).join(" · ")}${live ? ' · <span class="ok">now</span>' : soon ? " · in " + countdown(s - now) : ""}</small></span>

// ---- Calculadora (sem eval: lê a conta com segurança) ----
function calcHTML() {
  const k = ["C", "(", ")", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "±", "0", ".", "=", "√", "x²", "%", "⌫"];
  return `<div class="calc"><div class="cdisp"><div id="cExpr"></div><div id="cRes">0</div></div>
    <div class="ckeys">${k.map(x => `<button data-k="${x}" class="${"÷×−+=".includes(x) ? "op" : x === "C" ? "clr" : ""}${x === "=" ? " eq" : ""}">${x}</button>`).join("")}</div></div>`;
}
let cExpr = "", cJustEval = false;
function calcEval(src) {
  const t = src.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/\s+/g, "");
  let i = 0;
  const peek = () => t[i], eat = c => t[i] === c ? (i++, true) : false;
  function num() { const m = /^\d*\.?\d+(e[+-]?\d+)?/i.exec(t.slice(i)) || /^\d+\./.exec(t.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function factor() {
    let v;
    if (eat("-")) return -factor();
    if (eat("+")) return factor();
    if (t.startsWith("√", i)) { i++; v = Math.sqrt(factor()); }
    else if (eat("(")) { v = expr(); if (!eat(")")) throw 0; }
    else v = num();
    while (true) {
      if (eat("²")) v = v * v;
      else if (eat("%")) v = v / 100;
      else if (eat("^")) v = Math.pow(v, factor());
      else break;
    }
    return v;
  }
  function term() { let v = factor(); while (true) { if (eat("*")) v *= factor(); else if (eat("/")) v /= factor(); else if (peek() === "(" || peek() === "√") v *= factor(); else return v; } }
  function expr() { let v = term(); while (true) { if (eat("+")) v += term(); else if (eat("-")) v -= term(); else return v; } }
  const v = expr(); if (i !== t.length || !isFinite(v)) throw 0;
  return Math.round(v * 1e10) / 1e10;
}
function calcShow(final) {
  $("cExpr").textContent = cExpr || "";
  let r = "";
  try { r = cExpr ? calcEval(cExpr) : 0; } catch (e) { r = final ? "Error" : $("cRes").textContent; }
  $("cRes").textContent = typeof r === "number" ? r.toLocaleString("en-GB", { maximumFractionDigits: 10 }) : r;
  $("cRes").classList.toggle("final", !!final);
}
function calcKey(k) {
  if (cJustEval && /[\d.(√]/.test(k)) cExpr = "";
  cJustEval = false;
  switch (k) {
    case "C": cExpr = ""; break;
    case "⌫": cExpr = cExpr.slice(0, -1); break;
    case "=": try { cExpr = String(calcEval(cExpr)); cJustEval = true; calcShow(true); return; } catch (e) { calcShow(true); return; }
    case "±": cExpr = cExpr.startsWith("-(") && cExpr.endsWith(")") ? cExpr.slice(2, -1) : cExpr ? "-(" + cExpr + ")" : "-"; break;
    case "x²": cExpr += "²"; break;
    default: cExpr += k;
  }
  calcShow(false);
}
function calcInit() {
  TOOLS.querySelectorAll(".ckeys button").forEach(b => b.onclick = () => calcKey(b.dataset.k));
  document.addEventListener("keydown", e => {
    if (localStorage.getItem("jtool") !== "calc" || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
    const map = { "*": "×", "/": "÷", "-": "−", "Enter": "=", "=": "=", "Backspace": "⌫", "Escape": "C", "Delete": "C" };
    const k = map[e.key] || (/^[\d.+()%]$/.test(e.key) ? e.key : null);
    if (k) { e.preventDefault(); calcKey(k); }
  });
  calcShow(false);
}

// ================= Timer (estilo Apple) =================
let T = null, tFetchedAt = 0, chime = null;
const R = 74, C = 2 * Math.PI * R;

function ringSVG(frac) { return `<svg width="170" height="170"><circle class="bg" cx="85" cy="85" r="${R}" fill="none" stroke-width="9"/>
  <circle class="fg" id="tArc" cx="85" cy="85" r="${R}" fill="none" stroke-width="9" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>`; }

  if (st === "idle") {
    const last = JSON.parse(localStorage.getItem("jt") || '{"h":0,"m":5,"s":0}');
    box.innerHTML = `<div class="timer"><div class="ring">${ringSVG(1)}<div class="mid"><div class="left" id="tPrev">${fmtLeft((last.h * 3600 + last.m * 60 + last.s) * 1000)}</div><div class="bell">set a time</div></div></div>
      <div class="tside"><div class="pick"><label><input id="tH" type="number" min="0" max="23" value="${last.h}">hours</label><span>:</span>
        <label><input id="tM" type="number" min="0" max="59" value="${last.m}">min</label><span>:</span><label><input id="tS" type="number" min="0" max="59" value="${last.s}">sec</label></div>
        <div class="chips">${[[1, "1 min"], [5, "5 min"], [10, "10 min"], [15, "15 min"], [25, "25 min"], [45, "45 min"], [60, "1 h"]].map(([m, l]) => `<button data-m="${m}">${l}</button>`).join("")}</div>
        <input id="tLabel" placeholder="Label (e.g. Maths homework)" maxlength="40">
        <div class="tbtns"><button class="cbtn cancel" disabled>Cancel</button><button class="cbtn start" id="tStart">Start</button></div></div></div>`;
    const prev = () => { const h = +$("tH").value || 0, m = +$("tM").value || 0, s = +$("tS").value || 0; $("tPrev").textContent = fmtLeft((h * 3600 + m * 60 + s) * 1000); };
    ["tH", "tM", "tS"].forEach(id => { $(id).oninput = prev; $(id).onfocus = e => e.target.select(); });
    box.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const m = +b.dataset.m; $("tH").value = Math.floor(m / 60); $("tM").value = m % 60; $("tS").value = 0; prev(); startTimer(); });
    $("tStart").onclick = startTimer;
  } else {
    const done = st === "done";
    box.innerHTML = `<div class="timer"><div class="ring ${done ? "done" : ""}">${ringSVG(done ? 1 : leftNow() / T.totalMs)}<div class="mid">
      ${T.label ? `<div class="lab">${esc(T.label)}</div>` : ""}<div class="left" id="tLeft">${done ? "0:00" : fmtLeft(leftNow())}</div>
      <div class="bell" id="tBell">${done ? "Time's up!" : st === "paused" ? "paused" : "🔔 " + hm(new Date(Date.now() + leftNow()))}</div></div></div>
      <div class="tside"><div class="tbtns">${done ? `<button class="cbtn stop" id="tStop">Stop</button>` :
        `<button class="cbtn cancel" id="tCancel">Cancel</button>${st === "running" ? `<button class="cbtn pause" id="tPause">Pause</button>` : `<button class="cbtn start" id="tResume">Resume</button>`}`}</div>
      <div class="muted">${done ? "🔔 Your timer finished." : "Total " + fmtLeft(T.totalMs) + " · keeps running even if you close this window"}</div></div></div>`;
    $("tCancel") && ($("tCancel").onclick = () => timerAct({ action: "cancel" }));
    $("tPause") && ($("tPause").onclick = () => timerAct({ action: "pause" }));
    $("tResume") && ($("tResume").onclick = () => timerAct({ action: "resume" }));

// ================= Céu animado =================
const sky = { cv: $("sky"), ctx: $("sky").getContext("2d"), w: 0, h: 0, mode: "", stars: [], drops: [], flakes: [], clouds: [], flash: 0, nextFlash: 0, shoot: null, t0: performance.now() };

  return { sky: S?.weather?.sky || (new Date().getHours() < 7 || new Date().getHours() >= 19 ? "night" : "day"), cond: S?.weather?.cond || "clear" };
}
const GRAD = {
  day: { clear: ["#0d4f8c", "#0a3260", "#061a33"], partly: ["#1a4d7a", "#0f3155", "#071a30"], cloudy: ["#34495e", "#1f2d3d", "#0c1520"], fog: ["#465464", "#2a3440", "#111820"], rain: ["#283646", "#17212d", "#0a1018"], storm: ["#1d2430", "#11161e", "#06090e"], snow: ["#4a5a6c", "#2d3a48", "#141c26"] },
