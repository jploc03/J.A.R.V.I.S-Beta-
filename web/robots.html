<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot Room</title><link rel="stylesheet" href="/jarvis.css">
<style>
html,body{height:100%;overflow:hidden;background:#0b0820}
#stage{position:fixed;inset:0}
#stage canvas{display:block;cursor:grab}
.hudtop{position:fixed;top:14px;left:16px;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
.hudtop > *{pointer-events:auto}
.ttl{font:700 18px var(--hud);letter-spacing:4px;color:#fff;text-shadow:0 0 10px #ff6fd8,0 0 22px #b06bff}
.ttl small{display:block;font:500 12px var(--tech);letter-spacing:2px;color:#c9b8ff;opacity:.9}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font:600 13px var(--tech);letter-spacing:1px;color:#e6dcff;
  background:rgba(20,12,44,.65);border:1px solid rgba(190,150,255,.35);padding:6px 14px;z-index:4;white-space:nowrap;transition:opacity .3s;border-radius:12px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.tag b{display:inline-block;font:700 10.5px var(--hud);letter-spacing:2px;color:#fff;background:rgba(20,12,44,.7);border:1px solid var(--rc);border-radius:10px;padding:2px 8px;box-shadow:0 0 10px var(--rc)}
.tag span{display:block;font:600 11.5px var(--tech);color:var(--rc);text-shadow:0 0 6px #000,0 0 2px #000;margin-top:2px}
.tag i{display:block;font-style:normal;color:#ffcf5c;font:700 9px var(--hud);letter-spacing:1px;animation:blink2 .8s infinite}
@keyframes blink2{50%{opacity:.3}}
.tag.hov b{transform:scale(1.15)}
/* painel de conversa */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:6;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(24,14,52,.94),rgba(12,8,30,.96));border-left:1px solid var(--rc,#b06bff);
  box-shadow:-10px 0 40px -10px var(--rc,#b06bff);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
#panel.open{transform:none}
.ph{padding:16px 18px 12px;border-bottom:1px solid rgba(190,150,255,.25);display:flex;gap:12px;align-items:center}
.ph .dot{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,var(--rc) 40%,rgba(0,0,0,.2) 75%);box-shadow:0 0 18px var(--rc)}
.ph b{display:block;font:700 18px var(--hud);letter-spacing:3px;color:#fff}
.ph span{font:600 14px var(--tech);color:var(--rc)}
.ph .sp{flex:1}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.mm{max-width:92%;padding:9px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;animation:pin .25s ease-out;border-radius:12px}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.mm.me{align-self:flex-end;background:rgba(176,107,255,.22);border:1px solid rgba(190,150,255,.45);color:#fff}
.mm.bot{align-self:flex-start;background:rgba(255,255,255,.05);border-left:3px solid var(--rc);color:#efe8ff}
.mm.bot .who{display:block;font:700 9px var(--hud);letter-spacing:2px;color:var(--rc);margin-bottom:3px}
.mm.err{align-self:center;color:var(--red);font-size:13px}
.mm .say{cursor:pointer;opacity:.6;margin-left:6px;font-size:12px}
.mm .say:hover{opacity:1}
.mm.think{color:#ffcf5c;font:700 10px var(--hud);letter-spacing:2px;border:0}
.assign{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.assign div{border-left:2px solid var(--ac);padding:4px 8px;background:rgba(255,255,255,.04);font-size:13px;border-radius:6px}
.assign div b{font:700 9.5px var(--hud);letter-spacing:1.5px;color:var(--ac)}
.pin{padding:10px 12px 14px;border-top:1px solid rgba(190,150,255,.25);display:flex;gap:8px}
.pin input{flex:1}
.pin button{padding:9px 12px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.sugg button{font-size:9px;padding:5px 9px}
#log{position:fixed;left:16px;bottom:60px;width:min(360px,60vw);max-height:38vh;overflow-y:auto;z-index:4;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.lg{pointer-events:auto;background:rgba(20,12,44,.8);border:1px solid rgba(190,150,255,.3);border-left:3px solid var(--ac);padding:6px 10px;font-size:12.5px;color:#efe8ff;animation:pin .3s ease-out;border-radius:8px}
.lg b{font:700 9.5px var(--hud);letter-spacing:1.5px;color:var(--ac)}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--dim);padding:30px}
</style>

</div>
